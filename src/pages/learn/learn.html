<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../global.css" />
    <link rel="stylesheet" href="learn.css" />
    <link rel="stylesheet" href="../../components/ui/footer/footer.css" />
    <link rel="stylesheet" href="../../components/ui/navbar/navbar.css" />
    <title>¿Qué aprender?</title>
  </head>
  <body>
    <div id="navbar-container"></div>
    <div id="learn-container">
      <div class="resume">
        <div>
          <h1>¿Qué aprender después del bootcamp?</h1>
          <p>
            Rutas de crecimiento profesional por programa, explora habilidades y
            recursos recomendados.
          </p>
        </div>
        <div class="resume-buttons">
          <button
            id="open-program-form"
            class="btn-add-program"
            type="button"
            hidden
            style="display: none"
          >
            + Nuevo programa
          </button>
          <button
            type="button"
            id="open-manage-program-form"
            class="btn btn--secondary"
            hidden
            style="display: none"
          >
            Administrar programas
          </button>
        </div>
      </div>

      <div id="programs" class="">
        <ul id="program-tab-list"></ul>
      </div>

      <div class="content">
        <div class="content__routes helper">
          <h3>Rutas sugeridas</h3>
          <div class="content__routes__route"></div>
        </div>

        <div class="content__topics helper">
          <h3 id="topics-title">Habilidades clave</h3>
          <div class="content__topics__cards"></div>
        </div>
      </div>
    </div>
    <div id="footer-container"></div>
    <script src="../../components/ui/footer/footer.js"></script>
    <script src="../../components/ui/navbar/navbar.js"></script>
    <!-- Web component: modal para crear un nuevo trainingProgram -->
    <base-modal id="program-form-modal"></base-modal>

    <script
      type="module"
      src="../../components/ui/modal/base-modal/base-modal.js"
    ></script>
    <script type="module" src="learn.js"></script>
  </body>
</html>
