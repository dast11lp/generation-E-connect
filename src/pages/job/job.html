<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portales de Empleo</title>
    <link rel="stylesheet" href="../../../global.css">
    <link rel="stylesheet" href="job.css" />
    <link rel="stylesheet" href="../../components/ui/footer/footer.css">
    <link rel="stylesheet" href="../../components/ui/navbar/navbar.css">
  </head>

  <body>
    <div id="navbar-container"></div>
    <!-- Inicio Section de portales de empleo Henry -->
    <div class="container">
      <h1>Portales de Empleo</h1>
      <p class="subtitule">Plataformas confiables donde encontrar oportunidades tech- locales, globales y remotas.</p>
      
      <button type="button" id="open-job-form" class="btn btn--primary" hidden style="display: none">+ Agregar empleo</button>
      <button type="button" id="open-manage-job-form" class="btn btn--secondary" hidden style="display: none">Administrar empleos</button>

      <div class="filtros-portales">
        <button data-category="all" class="active">Todas</button>
        <button data-category="local">Locales</button>
        <button data-category="global">Globales</button>
        <button data-category="remota">Remotas</button>
      </div>

      <div class="grid_portales"></div>

      <base-modal id="job-form-modal"></base-modal>

      <script type="module" src="/src/components/ui/modal/base-modal/base-modal.js"></script>
      <script type="module" src="job.js"></script>
    </div>
    <!-- Fin Section de portales de empleo Henry -->
    <div id="footer-container"></div>
    <script src="../../components/ui/footer/footer.js"></script>
    <script src="../../components/ui/navbar/navbar.js"></script>
