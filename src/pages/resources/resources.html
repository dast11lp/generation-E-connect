<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../global.css">
    <link rel="stylesheet" href="resources.css">
    <link rel="stylesheet" href="../../components/ui/footer/footer.css">
    <link rel="stylesheet" href="../../components/ui/navbar/navbar.css">
    <title>Recursos</title>
</head>

<body>
    <div id="navbar-container"></div>

    <div class="contenedor-principal">
        <aside class="barra-lateral">
            <div class="contenedor-tipo-recursos">
                <h2>Tipo de recursos</h2>
                <label><input type="checkbox" name="tipo-recurso" value="PDF">PDF</label>
                <label><input type="checkbox" name="tipo-recurso" value="Plantilla">Plantilla</label>
                <label><input type="checkbox" name="tipo-recurso" value="Guía">Guía</label>
                <label><input type="checkbox" name="tipo-recurso" value="Enlace externo">Enlace externo</label>
            </div>

            <div class="contenedor-ordenar-por">
                <h2>Ordenar por</h2>
                <label><input type="radio" name="orden" value="recientes" checked>Más reciente</label>
                <label><input type="radio" name="orden" value="descargas">Más descargado</label>
                <label><input type="radio" name="orden" value="destacados">Destacados</label>
            </div>
        </aside>

        <main class="contenido-principal">
            <h1>Biblioteca de recursos</h1>
            <p>Guías, plantillas, videos y más para impulsar tu búsqueda laboral.</p>
            
            <div class="contenido-principal-toolbar">
                <input type="text" placeholder="Buscar recursos">
                <button type="button" id="open-resource-form" hidden style="display: none">+ Agregar recurso</button>
                <button type="button" id="open-manage-resource-form" hidden style="display: none">Administrar recursos</button>
            </div>
            
            <div class="categorias"></div>

            <div class="contenedor-recursos-filtro">
                <p>0 recursos encontrados</p>
            </div>

            <div class="contenedor-recursos"></div>

            
            <base-modal id="resource-form-modal"></base-modal>
        </main>
    </div>

    <div id="footer-container"></div>

    <script type="module" src="../../components/ui/modal/base-modal/base-modal.js"></script>
    <script type="module" src="resources.js"></script>
    <script src="../../components/ui/footer/footer.js"></script>
    <script src="../../components/ui/navbar/navbar.js"></script>
</body>

</html>
